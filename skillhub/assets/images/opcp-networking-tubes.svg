<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1500" height="760" fill="#ffffff"/>

  <text x="750" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000E9C">How the Network Components Co-exist</text>

  <!-- Legend -->
  <g font-size="11" fill="#1a1a2e">
    <rect x="40" y="46" width="20" height="14" rx="7" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="66" y="57">Network</text>

    <rect x="150" y="46" width="20" height="14" rx="7" fill="#e8eaff" stroke="#4949FF" stroke-width="2"/>
    <text x="176" y="57">Subnet (nested inside its network)</text>

    <rect x="400" y="46" width="20" height="14" rx="7" fill="#f3e8ff" stroke="#8e44ad" stroke-width="2"/>
    <text x="426" y="57">Trunk = one physical interface / LACP bond</text>

    <circle cx="700" cy="53" r="6" fill="#1a1a2e"/>
    <text x="712" y="57">Port</text>

    <line x1="780" y1="53" x2="810" y2="53" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
    <text x="818" y="57">VLAN-tagged traffic (tube)</text>

    <line x1="1010" y1="53" x2="1040" y2="53" stroke="#999999" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="1048" y="57">Formal only — no real traffic</text>
  </g>

  <!-- Network A: vlan301-net, encapsulating its subnet -->
  <rect x="40" y="140" width="260" height="100" rx="50" fill="#eafaf1" stroke="#27ae60" stroke-width="3"/>
  <text x="170" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">vlan301-net</text>
  <rect x="70" y="182" width="200" height="46" rx="23" fill="#e8eaff" stroke="#4949FF" stroke-width="2.5"/>
  <text x="170" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a2e">301-subnet</text>
  <text x="170" y="213" text-anchor="middle" font-size="9" fill="#555">192.168.31.0/24</text>

  <!-- Network B: vlan302-net, encapsulating its subnet -->
  <rect x="40" y="520" width="260" height="100" rx="50" fill="#eafaf1" stroke="#27ae60" stroke-width="3"/>
  <text x="170" y="547" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">vlan302-net</text>
  <rect x="70" y="562" width="200" height="46" rx="23" fill="#e8eaff" stroke="#4949FF" stroke-width="2.5"/>
  <text x="170" y="580" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a2e">302-subnet</text>
  <text x="170" y="593" text-anchor="middle" font-size="9" fill="#555">192.168.32.0/24</text>

  <!-- Connector tubes: sub-ports riding into the trunk (drawn first, so the port boxes sit on top) -->
  <path d="M300,190 L470,190 L470,384 L540,384" fill="none" stroke="#f39c12" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300,570 L470,570 L470,426 L540,426" fill="none" stroke="#16a085" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sub-port 1: real Neutron port created on vlan301-net, attached to the trunk with segmentation-id 301 -->
  <rect x="310" y="170" width="130" height="40" rx="8" fill="#fff4e0" stroke="#f39c12" stroke-width="2.5"/>
  <text x="375" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">sub-port-1</text>
  <text x="375" y="200" text-anchor="middle" font-size="8.5" fill="#8a5a0c">on vlan301-net · vlan 301</text>
  <circle cx="440" cy="190" r="6" fill="#1a1a2e"/>

  <!-- Sub-port 2: real Neutron port created on vlan302-net, attached to the trunk with segmentation-id 302 -->
  <rect x="310" y="550" width="130" height="40" rx="8" fill="#e6f5f1" stroke="#16a085" stroke-width="2.5"/>
  <text x="375" y="566" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">sub-port-2</text>
  <text x="375" y="580" text-anchor="middle" font-size="8.5" fill="#0f6652">on vlan302-net · vlan 302</text>
  <circle cx="440" cy="570" r="6" fill="#1a1a2e"/>

  <!-- Trunk outer pipe — encapsulates the parent port and both VLAN tubes -->
  <rect x="520" y="330" width="660" height="140" rx="70" fill="#f3e8ff" fill-opacity="0.6" stroke="#8e44ad" stroke-width="3"/>
  <text x="850" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b2c76">trunk — one physical interface / LACP bond</text>

  <!-- VLAN tubes running inside the trunk -->
  <rect x="540" y="368" width="620" height="32" rx="16" fill="#f39c12" fill-opacity="0.85" stroke="#c9770a" stroke-width="2"/>
  <text x="600" y="389" font-size="10" font-weight="bold" fill="#ffffff">VLAN 301</text>

  <rect x="540" y="410" width="620" height="32" rx="16" fill="#16a085" fill-opacity="0.85" stroke="#117a63" stroke-width="2"/>
  <text x="600" y="431" font-size="10" font-weight="bold" fill="#ffffff">VLAN 302</text>

  <!-- Parent port: formal attachment point of the trunk, no real traffic -->
  <circle cx="680" cy="330" r="6" fill="#1a1a2e"/>
  <path d="M680,330 L680,296" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="565" y="250" width="230" height="46" rx="10" fill="#f5f5f5" stroke="#999999" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="680" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#666666">trunk-port (parent)</text>
  <text x="680" y="281" text-anchor="middle" font-size="9" fill="#888888">on trunk-net — fictitious, no traffic</text>

  <!-- Trunk -> Instance -->
  <path d="M1180,400 L1210,400" fill="none" stroke="#8e44ad" stroke-width="26" stroke-linecap="round"/>

  <rect x="1210" y="350" width="230" height="100" rx="12" fill="#eef0fb" stroke="#000E9C" stroke-width="3"/>
  <text x="1325" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Bare-metal / VM instance</text>
  <text x="1325" y="410" text-anchor="middle" font-size="9" fill="#555">single NIC or LACP bond</text>
  <text x="1325" y="424" text-anchor="middle" font-size="9" fill="#555">carries VLAN 301 &amp; 302 tagged traffic</text>
</svg>
