<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="idc-arrow-green-fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
    <marker id="idc-arrow-blue-fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000E9C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1250" height="760" fill="#ffffff"/>

  <text x="625" y="38" text-anchor="middle" font-size="34" font-weight="bold" fill="#000E9C">Modèle d'identité OpenStack (Keystone)</text>

  <!-- Legend -->
  <g font-size="18" fill="#1a1a2e">
    <rect x="30" y="58" width="18" height="18" rx="3" stroke="#000E9C" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <text x="56" y="71">Domaine (frontière d'identité)</text>

    <rect x="340" y="58" width="18" height="18" fill="#e8eaff" stroke="#4949FF" stroke-width="2"/>
    <text x="366" y="71">Projet (conteneur de ressources)</text>

    <rect x="690" y="58" width="18" height="18" fill="#fff4e0" stroke="#f39c12" stroke-width="2"/>
    <text x="716" y="71">Groupe</text>

    <rect x="800" y="58" width="18" height="18" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
    <text x="826" y="71">Utilisateur</text>

    <line x1="30" y1="96" x2="70" y2="96" stroke="#27ae60" stroke-width="3" marker-end="url(#idc-arrow-green-fr)"/>
    <text x="78" y="101">Attribution de rôle (portée projet)</text>

    <line x1="520" y1="96" x2="560" y2="96" stroke="#000E9C" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#idc-arrow-blue-fr)"/>
    <text x="568" y="101">Attribution de rôle (portée domaine)</text>
  </g>

  <!-- Domain boundary -->
  <rect x="40" y="114" width="1170" height="630" rx="16" fill="none" stroke="#000E9C" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="60" y="140" font-size="23" font-weight="bold" fill="#000E9C">Domaine — ex. « ovhcloud »</text>
  <text x="60" y="163" font-size="17" fill="#555">Conteneur de plus haut niveau : regroupe les projets, utilisateurs et groupes ci-dessous et les isole des autres domaines</text>

  <!-- Column headings -->
  <text x="350" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Projets</text>
  <text x="940" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Utilisateurs &amp; Groupes</text>

  <!-- Project: Production -->
  <rect x="90" y="197" width="520" height="110" rx="8" fill="#e8eaff" stroke="#4949FF" stroke-width="2"/>
  <text x="350" y="224" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Projet : Production</text>
  <text x="350" y="248" text-anchor="middle" font-size="17" fill="#555">Conteneur isolé pour instances, réseaux, volumes</text>

  <!-- Project: Staging -->
  <rect x="90" y="332" width="520" height="110" rx="8" fill="#e8eaff" stroke="#4949FF" stroke-width="2"/>
  <text x="350" y="359" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Projet : Staging</text>
  <text x="350" y="383" text-anchor="middle" font-size="17" fill="#555">Conteneur isolé pour instances, réseaux, volumes</text>

  <!-- Group: Admins -->
  <rect x="700" y="197" width="480" height="160" rx="10" fill="#fff4e0" stroke="#f39c12" stroke-width="2"/>
  <text x="940" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Groupe : Admins</text>
  <rect x="720" y="242" width="210" height="45" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="825" y="269" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Utilisateur : alice</text>
  <rect x="950" y="242" width="210" height="45" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="1055" y="269" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Utilisateur : bob</text>
  <text x="940" y="332" text-anchor="middle" font-size="16" fill="#555">Les rôles accordés au groupe s'appliquent à tous les membres</text>

  <!-- Group: Developers -->
  <rect x="700" y="377" width="480" height="160" rx="10" fill="#fff4e0" stroke="#f39c12" stroke-width="2"/>
  <text x="940" y="402" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Groupe : Developers</text>
  <rect x="720" y="422" width="210" height="45" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="825" y="449" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Utilisateur : carol</text>
  <text x="940" y="512" text-anchor="middle" font-size="16" fill="#555">Les rôles accordés au groupe s'appliquent à tous les membres</text>

  <!-- Standalone User: service account -->
  <rect x="700" y="557" width="480" height="90" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="940" y="587" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Utilisateur : service-account</text>
  <text x="940" y="608" text-anchor="middle" font-size="17" fill="#555">Les utilisateurs peuvent aussi détenir des rôles</text>
  <text x="940" y="628" text-anchor="middle" font-size="17" fill="#555">directement, sans rejoindre un groupe</text>

  <!-- Admins -> Production: role admin -->
  <path d="M700,232 L610,232" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#idc-arrow-green-fr)"/>
  <text x="655" y="224" text-anchor="middle" font-size="18" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" fill="#27ae60">admin</text>

  <!-- Admins -> Staging: role admin -->
  <path d="M700,332 L655,332 L655,387 L610,387" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#idc-arrow-green-fr)"/>
  <text x="678" y="357" text-anchor="middle" font-size="18" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" fill="#27ae60">admin</text>

  <!-- Developers -> Staging: role member -->
  <path d="M700,412 L610,412" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#idc-arrow-green-fr)"/>
  <text x="655" y="430" text-anchor="middle" font-size="18" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" fill="#27ae60">member</text>

  <!-- service-account -> Production: role reader -->
  <path d="M700,592 L640,592 L640,282 L610,282" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#idc-arrow-green-fr)"/>
  <text x="655" y="274" text-anchor="middle" font-size="18" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" fill="#27ae60">reader</text>

  <!-- Admins -> Domain: domain-scoped admin role -->
  <path d="M1175,197 L1175,152" fill="none" stroke="#000E9C" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#idc-arrow-blue-fr)"/>
  <text x="1175" y="172" text-anchor="middle" font-size="18" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" fill="#000E9C">admin</text>
</svg>
