<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1300" height="720" fill="#ffffff"/>

  <text x="650" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#000E9C">Baremetal Port Group — Encapsulating Physical Ports</text>

  <!-- Legend -->
  <g font-size="11" fill="#1a1a2e">
    <rect x="30" y="44" width="20" height="14" rx="7" fill="#e8eaff" stroke="#4949FF" stroke-width="2"/>
    <text x="56" y="55">Port (NIC)</text>

    <rect x="150" y="44" width="20" height="14" rx="4" fill="#f3e8ff" stroke="#8e44ad" stroke-width="2"/>
    <text x="176" y="55">Port group (encapsulates its ports)</text>

    <rect x="400" y="44" width="20" height="14" rx="3" fill="#f5f6fa" stroke="#555555" stroke-width="2"/>
    <text x="426" y="55">Physical switch</text>

    <line x1="540" y1="51" x2="570" y2="51" stroke="#16a085" stroke-width="8" stroke-linecap="round"/>
    <text x="578" y="55">Cable to switch A</text>

    <line x1="710" y1="51" x2="740" y2="51" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
    <text x="748" y="55">Cable to switch B</text>

    <rect x="920" y="44" width="20" height="14" rx="7" fill="#eef0fb" stroke="#000E9C" stroke-width="2"/>
    <text x="946" y="55">Aggregated LACP link</text>
  </g>

  <!-- Baremetal Node -->
  <rect x="40" y="90" width="580" height="545" rx="14" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="112" font-size="14" font-weight="bold" fill="#666666">Baremetal Node</text>

  <!-- Port group container -->
  <rect x="70" y="130" width="490" height="350" rx="16" fill="#f3e8ff" fill-opacity="0.5" stroke="#8e44ad" stroke-width="3"/>
  <text x="315" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b2c76">pg-lacp — mode 802.3ad (LACP)</text>
  <text x="315" y="170" text-anchor="middle" font-size="9" fill="#7a5090">openstack baremetal port group create --mode 802.3ad</text>

  <!-- Ports, nested inside the port group -->
  <rect x="100" y="185" width="260" height="50" rx="25" fill="#e8eaff" stroke="#4949FF" stroke-width="2.5"/>
  <text x="230" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Port 1 (NIC)</text>
  <text x="230" y="219" text-anchor="middle" font-size="9" fill="#555">MAC e0:9d:73:79:bb:7c — PXE</text>

  <rect x="100" y="245" width="260" height="50" rx="25" fill="#e8eaff" stroke="#4949FF" stroke-width="2.5"/>
  <text x="230" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Port 2 (NIC)</text>
  <text x="230" y="279" text-anchor="middle" font-size="9" fill="#555">MAC e0:9d:73:79:bb:7d</text>

  <rect x="100" y="335" width="260" height="50" rx="25" fill="#e8eaff" stroke="#4949FF" stroke-width="2.5"/>
  <text x="230" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Port 3 (NIC)</text>
  <text x="230" y="369" text-anchor="middle" font-size="9" fill="#555">MAC e0:9d:73:ba:73:6c</text>

  <rect x="100" y="395" width="260" height="50" rx="25" fill="#e8eaff" stroke="#4949FF" stroke-width="2.5"/>
  <text x="230" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Port 4 (NIC)</text>
  <text x="230" y="429" text-anchor="middle" font-size="9" fill="#555">MAC e0:9d:73:ba:73:6d</text>

  <!-- Cables to the redundant ToR switches -->
  <text x="925" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#666666">Redundant ToR switches</text>

  <path d="M360,210 L800,210" fill="none" stroke="#16a085" stroke-width="14" stroke-linecap="round"/>
  <path d="M360,270 L800,270" fill="none" stroke="#16a085" stroke-width="14" stroke-linecap="round"/>
  <path d="M360,360 L800,360" fill="none" stroke="#f39c12" stroke-width="14" stroke-linecap="round"/>
  <path d="M360,420 L800,420" fill="none" stroke="#f39c12" stroke-width="14" stroke-linecap="round"/>

  <rect x="800" y="185" width="250" height="110" rx="10" fill="#f5f6fa" stroke="#555555" stroke-width="2.5"/>
  <text x="925" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Switch A (tor1a)</text>
  <text x="925" y="252" text-anchor="middle" font-size="9" fill="#555">ToR switch — ports 1 &amp; 2</text>

  <rect x="800" y="335" width="250" height="110" rx="10" fill="#f5f6fa" stroke="#555555" stroke-width="2.5"/>
  <text x="925" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Switch B (tor1b)</text>
  <text x="925" y="402" text-anchor="middle" font-size="9" fill="#555">ToR switch — ports 3 &amp; 4</text>

  <!-- Port group -> aggregated bond -->
  <path d="M315,480 L315,560" fill="none" stroke="#000E9C" stroke-width="16" stroke-linecap="round"/>
  <rect x="145" y="560" width="340" height="55" rx="27" fill="#eef0fb" stroke="#000E9C" stroke-width="3"/>
  <text x="315" y="592" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">bond0 — aggregated LACP link</text>

  <!-- Bond -> Instance -->
  <path d="M315,615 L315,650" fill="none" stroke="#000E9C" stroke-width="16" stroke-linecap="round"/>
  <rect x="165" y="650" width="300" height="60" rx="10" fill="#eef0fb" stroke="#000E9C" stroke-width="2.5"/>
  <text x="315" y="675" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Attached to instance</text>
  <text x="315" y="691" text-anchor="middle" font-size="9" fill="#555">full aggregated bandwidth of all bonded ports</text>
</svg>
