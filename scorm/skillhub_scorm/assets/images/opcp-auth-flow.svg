<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="af-arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000E9C"/>
    </marker>
    <marker id="af-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#000E9C">Keycloak &amp; Keystone Authentication Flow</text>

  <!-- Legend -->
  <g font-size="15" fill="#1a1a2e">
    <line x1="292" y1="60" x2="332" y2="60" stroke="#000E9C" stroke-width="3" marker-end="url(#af-arrow-navy)"/>
    <text x="340" y="65">Request</text>

    <line x1="436" y1="60" x2="476" y2="60" stroke="#27ae60" stroke-width="3" marker-end="url(#af-arrow-green)"/>
    <text x="484" y="65">Response / data</text>

    <line x1="633" y1="60" x2="673" y2="60" stroke="#000E9C" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#af-arrow-navy)"/>
    <text x="681" y="65">Internal processing</text>
  </g>

  <!-- Actor: User -->
  <rect x="45" y="90" width="230" height="55" rx="8" fill="#f3e8fd" stroke="#8e44ad" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">User</text>
  <text x="160" y="133" text-anchor="middle" font-size="12" fill="#555">OpenStack CLI / Horizon</text>

  <!-- Actor: Keycloak (text box swapped with Keystone) -->
  <rect x="435" y="90" width="230" height="55" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="550" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Keycloak</text>
  <text x="550" y="133" text-anchor="middle" font-size="12" fill="#555">Identity Provider (IAM)</text>

  <!-- Actor: Keystone (text box swapped with Keycloak) -->
  <rect x="825" y="90" width="230" height="55" rx="8" fill="#e8eaff" stroke="#4949FF" stroke-width="2"/>
  <text x="940" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Keystone</text>
  <text x="940" y="133" text-anchor="middle" font-size="12" fill="#555">OpenStack Identity Service</text>

  <!-- Lifelines -->
  <line x1="160" y1="145" x2="160" y2="545" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="550" y1="145" x2="550" y2="545" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="940" y1="145" x2="940" y2="545" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Step 1: User -> Keystone -->
  <path d="M160,190 L550,190" fill="none" stroke="#000E9C" stroke-width="3" marker-end="url(#af-arrow-navy)"/>
  <text x="355" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#000E9C">1. Authenticate</text>
  <text x="355" y="207" text-anchor="middle" font-size="13" fill="#555">Username / password or token</text>

  <!-- Step 2: Keystone internal processing (self-loop) -->
  <text x="585" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#000E9C">2. Map attributes to OpenStack resources</text>
  <path d="M550,252 L620,252 L620,292 L550,292" fill="none" stroke="#000E9C" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#af-arrow-navy)"/>
  <text x="585" y="325" text-anchor="middle" font-size="13" fill="#555">project attribute to project scope + role bindings</text>

  <!-- Step 3: Keystone -> Keycloak -->
  <path d="M550,365 L940,365" fill="none" stroke="#000E9C" stroke-width="3" marker-end="url(#af-arrow-navy)"/>
  <text x="745" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#000E9C">3. Forward authentication request</text>
  <text x="745" y="382" text-anchor="middle" font-size="13" fill="#555">OpenID Connect (OIDC)</text>

  <!-- Step 4: Keycloak -> Keystone -->
  <path d="M940,430 L550,430" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#af-arrow-green)"/>
  <text x="745" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">4. User authenticated</text>
  <text x="745" y="447" text-anchor="middle" font-size="13" fill="#555">Returns the "project" attribute via the group mapper</text>

  <!-- Step 5: Keystone -> User -->
  <path d="M550,500 L160,500" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#af-arrow-green)"/>
  <text x="355" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">5. Issue scoped token</text>
  <text x="355" y="517" text-anchor="middle" font-size="13" fill="#555">Token bound to the mapped project &amp; roles</text>

  <!-- Lifeline end markers -->
  <circle cx="160" cy="545" r="4" fill="#8e44ad"/>
  <circle cx="550" cy="545" r="4" fill="#4949FF"/>
  <circle cx="940" cy="545" r="4" fill="#e74c3c"/>
</svg>
